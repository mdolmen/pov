[project]
name = "pov"
version = "0.1.0"
description = "pov — TODO.md aggregator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "watchdog>=6.0.0",
]

[project.scripts]
pov = "pov.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pov"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
