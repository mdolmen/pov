[package]
name = "pov-core"
version = "0.1.0"
description = "pov domain logic, shared by the app and the CLI"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
chrono = "0.4.45"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
thiserror = "2"

[dev-dependencies]
serde_json = "1.0.151"
tempfile = "3"
