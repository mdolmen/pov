[package]
name = "pov-core"
version = "0.1.0"
description = "pov domain logic, shared by the app and the CLI"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
chrono = "0.4.45"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
thiserror = "2"
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
