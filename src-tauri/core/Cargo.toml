[package]
name = "pov-core"
version = "0.1.0"
description = "pov domain logic, shared by the app and the CLI"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"], optional = true }
notify = "8.2.0"
regex = "1.13.1"
rmcp = { version = "3.5.1", optional = true, default-features = false, features = ["server", "macros", "transport-io"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
similar = { version = "3.2.0", default-features = false, features = ["std"] }
thiserror = "2"
tiny_http = { version = "0.12.0", optional = true }
tokio = { version = "1", optional = true, features = ["rt", "macros", "io-std"] }
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[features]
# Test-only HTTP bridge to the command dispatch, for the UI tests.
bridge = ["dep:tiny_http"]
# The `pov` command-line tool and its MCP server.
cli = ["dep:clap", "dep:rmcp", "dep:tokio"]

[[bin]]
name = "pov-bridge"
required-features = ["bridge"]

[[bin]]
name = "pov-cli"
required-features = ["cli"]

[[test]]
name = "cli"
required-features = ["cli"]
